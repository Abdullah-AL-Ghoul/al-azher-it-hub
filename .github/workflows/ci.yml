name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npx vitest run

      - name: Coverage gate
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: E2E tests (Playwright, desktop + a11y scans)
        # The specs are public-route only and pass without Supabase env vars
        # beyond read-only invalid-credential sign-in attempts. Authenticated
        # flows would need repository secrets.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: E2E mobile sanity (Pixel 7)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx playwright test --project=mobile-chromium e2e/smoke.spec.js e2e/interactions.spec.js

      - name: Lighthouse performance budget
        run: npx --yes @lhci/cli@0.14.x autorun

      - name: Security audit (moderate+)
        run: npm audit --audit-level=moderate
